<script>
(function(){
  'use strict';
  var ITER=310000, norm=function(c){return String(c).normalize('NFKC').replace(/\s+/g,'').toUpperCase();};
  function bytes(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
  window.decifrar=function(codigo){
    if(!(window.crypto&&crypto.subtle)) return Promise.reject(new Error('sem-crypto'));
    var d=bytes(document.getElementById('carga').textContent.trim()), sal=d.slice(0,16), iv=d.slice(16,28), ct=d.slice(28);
    return crypto.subtle.importKey('raw',new TextEncoder().encode(norm(codigo)),'PBKDF2',false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:sal,iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct).then(function(p){window.__vltChave=k;return p;});})   // a chave só fica disponível se o código abriu a página; as imagens usam a mesma
      .then(function(p){return new TextDecoder().decode(p);});
  };
  function abrir(html){document.open();document.write(html);document.close();}
  function guardar(c){try{sessionStorage.setItem('vlt-demo',c);}catch(e){}}
  function guardado(){try{return sessionStorage.getItem('vlt-demo');}catch(e){return null;}}
  function esquecer(){try{sessionStorage.removeItem('vlt-demo');}catch(e){}}
  var f=document.getElementById('f'),b=document.getElementById('b'),msg=document.getElementById('msg'),c=document.getElementById('c');
  f.addEventListener('submit',function(ev){
    ev.preventDefault(); msg.textContent=''; b.disabled=true; b.textContent='Abrindo…';
    var cod=c.value;
    window.decifrar(cod).then(function(html){guardar(cod);abrir(html);}).catch(function(e){
      b.disabled=false; b.textContent='Entrar';
      msg.textContent=(e&&e.message==='sem-crypto')?'Este navegador não permite abrir a demonstração. Use Chrome, Edge, Safari ou Firefox atualizados, por https.':'Código incorreto. Confira e tente de novo.';
      c.select();
    });
  });
  var g=guardado();                       // mesma aba, recarregou a página: não pede o código de novo
  if(g) window.decifrar(g).then(abrir).catch(esquecer); else c.focus();
})();
</script></body></html>
